name: build-desktop

# 为什么要有这个工作流
# --------------------
# PyInstaller **不能交叉编译**：Windows 的 .exe 只能在 Windows 上构建，
# macOS 的 .app 只能在 macOS 上构建。本地只有一台 Windows，所以苹果那份
# 交给这里的 macOS 构建机。三个平台各出一份，统一挂到一个 Release 上。
#
# 触发方式
#   * 推一个 v* 标签            -> 构建 + 建 Release
#   * 手动 Run workflow         -> 只出构建产物（下载 artifact 看）
#   * 手动 Run 并填 tag         -> 构建 + 给这个 tag 建 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的标签（留空则只构建，不建 Release）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Intel Mac 的构建机（macos-13）已被 GitHub 标记为弃用，随时可能下线。
    # 标成可失败 —— 它挂了不该连带整个发布失败，用户还可以用 Rosetta 之外的办法
    # 自行在 Intel 机器上跑同一个脚本构建。
    continue-on-error: ${{ matrix.optional }}
    # GitHub 的日志查看器是 UTF-8，固定成 UTF-8 才不会让中文构建信息变乱码。
    # （脚本自己也会把 stdout 的 errors 放宽，双保险 —— 本地在英文版 Windows
    # 的控制台上跑时，那一层才是真正起作用的那道。）
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64,  optional: false }
          - { os: macos-latest,   name: macos-arm64,  optional: false }
          - { os: macos-13,       name: macos-x64,    optional: true  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # pillow 不只是 make_icon.py 要：macOS 上 PyInstaller 要用它把
          # PNG 转成 .icns，缺了会在 BUNDLE 阶段直接失败
          python -m pip install pywebview pyinstaller pillow

      - name: 打包 + 页面内自检
        # --verify 会把产物真的启动一次，读页面自检结果。
        # PyInstaller 最容易坏的地方是"东西没进去"（页面文件 / webview 后端），
        # 静态检查看不出来，只有真跑一次才知道。
        run: python packaging/build_app.py --verify

      - name: 附上零安装的单文件页面
        shell: bash
        run: cp webgui/isoclock.html dist/isoclock.html

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/isoclock.html
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -la artifacts

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
